name: unit-tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Domain engine tests
        run: node --test "tools/tests/*.test.mjs"
      - name: Monthly Apex simulation
        run: node tools/monthly-apex-simulator/simulate.mjs
      - name: Runner Passport simulation
        run: node tools/runner-passport-simulator/simulate.mjs

      # Regenerate the fixture corpus and fail on drift, then measure detection quality.
      # The simulator exits non-zero if any honest fixture is rejected or any attack passes.
      - name: Run fixture corpus is reproducible
        run: |
          node tools/run-fixture-generator/generate.mjs
          if ! git diff --quiet -- content/fixtures; then
            echo "::error::Generated run fixtures differ from the committed tree."
            exit 1
          fi

      - name: Anti-cheat simulation (precision, recall, false positives)
        run: node tools/anti-cheat-simulator/simulate.mjs
