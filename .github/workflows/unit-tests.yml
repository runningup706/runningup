name: unit-tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Domain engine tests
        run: node --test "tools/tests/*.test.mjs"
      - name: Monthly Apex simulation
        run: node tools/monthly-apex-simulator/simulate.mjs
      - name: Runner Passport simulation
        run: node tools/runner-passport-simulator/simulate.mjs
