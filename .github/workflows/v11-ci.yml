# V11 활성 트리가 정본 수량, 금지 런타임, Supabase 계약을 계속 지키는지 확인한다.
name: v11-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static:
    name: catalogs, policy and legacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run validate
      - run: npm run validate:legacy
      - run: npm test

  domain:
    name: upload policy without a Unity Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm run test:domain

  database:
    name: migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL 16 and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-16-pgtap
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      # 러너에 딸린 관리형 클러스터는 postgresql-common이 소유하고 있어
      # pg_ctl로 직접 띄울 수 없다. 러너 사용자 소유의 임시 클러스터를 새로 만든다.
      - name: Start a throwaway cluster
        run: |
          initdb --pgdata "$RUNNER_TEMP/pgdata" --username postgres --auth trust
          pg_ctl --pgdata "$RUNNER_TEMP/pgdata" \
            --options "-p 55432 -k /tmp" \
            --log "$RUNNER_TEMP/pg.log" --wait start
          psql --host /tmp --port 55432 --username postgres \
            --command "select version();"
      - run: npm run test:db
      - name: Show the server log when the suite fails
        if: failure()
        run: cat "$RUNNER_TEMP/pg.log"

  art_gate:
    name: production art gate stays closed without licensed assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 자산이 없을 때 art:gate가 실패하는 것이 정본 동작이다.
      # 게이트가 갑자기 통과하면 우회가 생겼다는 뜻이므로 CI를 실패시킨다.
      - name: art:gate must fail while BLOCKED_ART_ASSET holds
        run: |
          if npm run art:gate; then
            echo "art:gate passed without licensed production art — gate was weakened." >&2
            exit 1
          fi
          npm run art:validate
