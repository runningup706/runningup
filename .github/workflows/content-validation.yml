name: content-validation

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # Content is generated. If the committed tree and a fresh regeneration disagree,
      # someone hand-edited a generated file and the launch counts can no longer be trusted.
      - name: Regenerate content and seed
        run: |
          node tools/content-factory/build.mjs
          node tools/content-factory/emit-seed.mjs
      - name: Fail if generated output drifted from the commit
        run: |
          if ! git diff --quiet -- content backend/supabase/seed.sql; then
            echo "::error::Generated content differs from the committed tree."
            git diff --stat -- content backend/supabase/seed.sql
            exit 1
          fi

      - name: Launch content validation (hard count + duplicate gate)
        run: node tools/content-validator/validate.mjs
