name: unity-domain-tests

# The Unity domain layer carries no UnityEngine references (master # 17.2), so it can be
# compiled and tested by plain .NET without an Editor or a licence. This job is what keeps
# that property true: adding a Unity dependency to the domain layer breaks the build here.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # The fixture is generated by the JS engine and replayed by the C# client. Regenerating
      # it here means a JS change that the client has not matched fails this job.
      - name: Regenerate conformance fixture from the JS engine
        run: node tools/conformance/export-fixtures.mjs

      - name: Fail if the committed fixture drifted
        run: |
          if ! git diff --quiet -- content/conformance; then
            echo "::error::Conformance fixture is stale. Run tools/conformance/export-fixtures.mjs and commit."
            git diff --stat -- content/conformance
            exit 1
          fi

      - name: Unity domain layer tests
        run: dotnet test client/dotnet/RunningUp.Domain.Tests/RunningUp.Domain.Tests.csproj --nologo
