name: kotlin-tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  running-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android-running-plugin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@cc4fc85e6b35bafd578d5ffbc76a5518407e1af0 # v4.2.1

      # The journal, the upload queue and the anomaly checks carry no Android dependency
      # precisely so they can be tested here, without a device or an emulator.
      - name: Run-capture core tests
        run: gradle test --console=plain
