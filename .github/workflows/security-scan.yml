name: security-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A service-role key or a signing secret must never reach the repository.
      - name: Scan for committed secrets
        run: |
          set -euo pipefail
          patterns='service_role|SUPABASE_SERVICE|BEGIN (RSA|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9]{20,}|-----BEGIN CERTIFICATE-----'
          if git grep -nIE "$patterns" -- . ':(exclude).github/workflows/security-scan.yml' ':(exclude)docs/SECURITY.md'; then
            echo "::error::Possible secret committed to the repository."
            exit 1
          fi
          echo "no secret patterns found"

      - name: Fail if a keystore or build artifact was committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(apk|aab|keystore|jks|p12)$'; then
            echo "::error::Binary signing or build artifacts must not live in git."
            exit 1
          fi
          echo "no signing or build artifacts committed"
