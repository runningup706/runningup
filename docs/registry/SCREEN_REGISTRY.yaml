# SCREEN_REGISTRY — what screens exist, and what is true about each of them
#
# WHY THIS FILE
#
# `SCREEN_CATALOG_V14.json` mixes shipped screens, planned screens and internal tools in
# one list, so it cannot answer "what can a user actually open today". This registry can,
# because it is compared against the code: `tests/screen-registry.test.mjs` reads the
# `Screen` enum out of `V14ScreenFlowController.cs` and fails if the two disagree in either
# direction — a screen in the enum with no entry here, or an entry here claiming
# IMPLEMENTED for a screen the enum does not have.
#
# implementation_status:
#   IMPLEMENTED    reachable in the running app, every listed feature works
#   PARTIAL        reachable, but a listed feature is stubbed or unwired
#   APPROVED_DESIGN design settled, no runtime yet
#   PLANNED        agreed to exist, nothing settled
#   DEPRECATED     still in the build, on the way out
#   INTERNAL_TOOL  not user-facing
#
# back_policy is the Android system-back behaviour, which is the single most-reported
# defect class in this app and therefore stated per screen rather than assumed.

schema_version: 1
source_of_truth: client/unity/Assets/RunningUp/V14/UI/V14ScreenFlowController.cs
enum_name: Screen
checked_by: tests/screen-registry.test.mjs

screens:
