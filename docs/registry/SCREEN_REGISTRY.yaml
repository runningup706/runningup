# Screens the product needs and does not have. Listed so that "not built" is a recorded
# state rather than an absence somebody has to notice.
planned_screens:
  - id: MyRunner
    implementation_status: PLANNED
    design_status: APPROVED_DESIGN
    features: [base_style_picker, appearance_preview]
    backend_requirements: [my_runner_base_styles, my_runners]
    notes: The 24 base styles have a catalogue, a schema and a seed. No screen opens them.

  - id: Wardrobe
    implementation_status: PLANNED
    design_status: APPROVED_DESIGN
    features: [slot_grid, set_browser, owned_filter, equip, preset]
    backend_requirements: [wearable_items, outfit_sets, my_runner_equipment]
    notes: >-
      684 items across 18 slots and 120 sets exist and the equip rule is enforced by the
      database. Needs virtualization — the direction is explicit that 600 items must not
      all be instantiated at once.

  - id: GlobalEvent
    implementation_status: PLANNED
    design_status: APPROVED_DESIGN
    features: [schedule, entry, check_in, heat, countdown, live_field, result]
    backend_requirements: [global_events, global_event_occurrences, global_event_entries]
    notes: >-
      Capacity 50-100 is designed, constrained and gated. Every load-test evidence entry
      reads NOT_RUN.
